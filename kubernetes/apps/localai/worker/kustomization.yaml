---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: localai
resources:
  - ../base

patches:
  - target:
      kind: Deployment
      name: localai
    patch: |
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: s1-main01-cpwr10
      - op: replace
        path: /metadata/name
        value: localai-worker
      - op: replace
        path: /spec/selector/matchLabels/app
        value: localai-worker
      - op: replace
        path: /spec/template/metadata/labels/app
        value: localai-worker
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits
        value:
          cpu: "5"
          memory: "3Gi"
      - op: add
        path: /spec/template/metadata/labels/role
        value: whisper-backend