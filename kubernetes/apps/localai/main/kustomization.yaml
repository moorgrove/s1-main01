---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - namespace.yaml
  - service.yaml
  - pvc.yaml
  - secrets.enc.yaml

patches:
  - target:
      kind: Deployment
      name: localai
    patch: |
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: s1-main01-cpwr11