---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localai
  namespace: localai
  labels:
    app: localai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localai
  template:
    metadata:
      labels:
        app: localai
    spec:
      hostNetwork: true
      containers:
      - name: localai
        image: docker.io/localai/localai:v4.4.3
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        env:
        - name: MODELS_PATH
          value: "/models"
        - name: LOCALAI_BACKENDS_PATH
          value: "/models/backends"
        - name: THREADS
          value: "5"
        - name: LOCALAI_P2P
          value: "true"
        - name: LOCALAI_FEDERATED
          value: "true"
        - name: LOCALAI_P2P_DISABLE_DHT
          value: "true"
        - name: LOCALAI_P2P_TOKEN
          valueFrom:
            secretKeyRef:
              name: localai-secrets
              key: p2p-token
        - name: MAX_REQUEST_BODY_SIZE
          value: "100"
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "5"
            memory: "20Gi"
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: models-volume
          mountPath: /models
        - name: output-volume
          mountPath: /output
        - name: dri
          mountPath: /dev/dri
      volumes:
      - name: dri
        hostPath:
          path: /dev/dri
      - name: models-volume
        persistentVolumeClaim:
          claimName: localai-models
      - name: output-volume
        persistentVolumeClaim:
          claimName: localai-output