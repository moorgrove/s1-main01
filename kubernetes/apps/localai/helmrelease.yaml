apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: localai
  namespace: localai
spec:
  interval: 15m
  chart:
    spec:
      chart: local-ai
      version: ">=2.0.0"
      sourceRef:
        kind: HelmRepository
        name: go-skynet
        namespace: localai
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    replicaCount: 1
    nodeSelector:
      kubernetes.io/hostname: s1-main01-cpwr11
    image:
      repository: localai/localai
      tag: latest-gpu-intel
      pullPolicy: IfNotPresent
    env:
      WHISPER_OPEN_VINO: "true"
      MODELS_PATH: "/models"
      THREADS: "2" 
    resources:
      requests:
        cpu: "500m"
        memory: "512Mi"
      limits:
        cpu: "2"
        memory: "3Gi"
    extraVolumes:
      - name: dri
        hostPath:
          path: /dev/dri
    extraVolumeMounts:
      - name: dri
        mountPath: /dev/dri
    persistence:
      models:
        enabled: true
        storageClass: "ceph-fs-hdd-r2"
        size: 15Gi
      output:
        enabled: true
        storageClass: "ceph-fs-hdd-r2"
        size: 2Gi
    service:
      main:
        controller: localia
        type: LoadBalancer
        annotations:
          io.cilium/lb-ipam-ips: "192.168.201.120"
          # tailscale.com/expose: "true"
          # tailscale.com/hostname: "s1-main01-localai"
        ports:
          http:
            port: 80