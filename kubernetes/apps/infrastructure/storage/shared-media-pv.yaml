---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: svtplay-dl-pv
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: cephfs.csi.ceph.com
    volumeHandle: svtplay-dl-pv
    volumeAttributes:
      clusterID: rook-ceph
      fsName: hdd-fs-r2
      rootPath: /volumes/svtplay-dl