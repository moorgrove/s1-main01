apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome
  namespace: music
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: navidrome
  template:
    metadata:
      labels:
        app: navidrome
    spec:
      initContainers:
        - name: netbird-resolv-isolate
          image: busybox:1.36
          command: ["sh", "-c", "cp /etc/resolv.conf /netbird-etc/resolv.conf"]
          volumeMounts:
            - name: netbird-etc
              mountPath: /netbird-etc
      containers:
        - name: navidrome
          image: deluan/navidrome:latest
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          env:
            - name: ND_LOGLEVEL
              value: info
            - name: ND_SCANSCHEDULE
              value: 1h
            - name: TZ
              value: Europe/Stockholm
          ports:
            - containerPort: 4533
          volumeMounts:
            - name: data
              mountPath: /data
            - name: music
              mountPath: /music
              readOnly: true

        - name: caddy
          image: caddy:2-alpine
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: caddy-config
              mountPath: /etc/caddy

        - name: netbird
          image: netbirdio/netbird:latest
          securityContext:
            capabilities:
              add: ["NET_ADMIN", "SYS_ADMIN"]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          env:
            - name: NB_SETUP_KEY
              valueFrom:
                secretKeyRef:
                  name: netbird-navidrome-secrets
                  key: setup-key
          volumeMounts:
            - name: netbird-config
              mountPath: /var/lib/netbird
            - name: netbird-etc
              mountPath: /etc

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: navidrome-data
        - name: music
          persistentVolumeClaim:
            claimName: navidrome-music
        - name: caddy-config
          configMap:
            name: navidrome-caddyfile
        - name: netbird-config
          persistentVolumeClaim:
            claimName: navidrome-netbird
        - name: netbird-etc
          emptyDir: {}