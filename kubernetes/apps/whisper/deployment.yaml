---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper-openvino
  namespace: whisper
  labels:
    app: whisper-openvino
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whisper-openvino
  template:
    metadata:
      labels:
        app: whisper-openvino
    spec:
      priorityClassName: low-priority
      nodeSelector:
        kubernetes.io/hostname: s1-main01-cpwr11
      containers:
        - name: whisper
          image: fedirz/faster-whisper-openvino:latest
          ports:
            - containerPort: 8000
              name: api
          env:
            - name: MODEL
              value: "base"
            - name: DEVICE
              value: "GPU"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          securityContext:
            privileged: true
          volumeMounts:
            - name: dri
              mountPath: /dev/dri
      volumes:
        - name: dri
          hostPath:
            path: /dev/dri
