apiVersion: apps/v1
kind: Deployment
metadata:
  name: minuspod
  namespace: podcast
  labels:
    app: minuspod
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minuspod
  template:
    metadata:
      labels:
        app: minuspod
    spec:
      priorityClassName: batch-priority
      nodeSelector:
        kubernetes.io/hostname: s1-main01-cpwr11
      containers:
        - name: minuspod
          image: ttlequals0/minuspod:2.79.0-cpu
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: MINUSPOD_MASTER_PASSPHRASE
              valueFrom:
                secretKeyRef:
                  name: minuspod-secrets
                  key: master-passphrase
            - name: BASE_URL
              valueFrom:
                secretKeyRef:
                  name: minuspod-secrets
                  key: base-url
            - name: MINUSPOD_PORT
              value: "8000"
            - name: LLM_PROVIDER
              value: "openai-compatible"
            - name: OPENAI_BASE_URL
              value: "http://localai.localai.svc.cluster.local/v1"
            - name: OPENAI_API_KEY
              value: "not-used-but-required"
            - name: OPENAI_MODEL
              value: "qwen_qwen3.5-4b"
            - name: WHISPER_BACKEND
              value: "openai-api"
            - name: WHISPER_API_BASE_URL
              value: "http://localai.localai.svc.cluster.local/v1"
            - name: WHISPER_API_MODEL
              value: "kb-whisper-small"
            - name: WHISPER_API_KEY
              value: "not-used-but-required"
            - name: CHUNK_SIZE_TOKENS 
              value: "2500"
            - name: MAX_LLM_CONCURRENCY
              value: "1"
            - name: LLM_API_TIMEOUT
              value: "600"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "4"
              memory: "5Gi"
          volumeMounts:
            - name: minuspod-data
              mountPath: /app/data
            - name: minuspod-assets
              mountPath: /app/assets

        - name: caddy
          image: caddy:2.9-alpine
          command:
            - caddy
            - run
            - --config
            - /etc/caddy/Caddyfile
          ports:
            - name: https
              containerPort: 443
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
            - name: tls
              mountPath: /certs
              readOnly: true

        - name: netbird
          image: netbirdio/netbird:0.76.0
          env:
            - name: TZ
              value: Europe/Stockholm
            - name: NB_HOSTNAME
              value: minuspod-s1-main01
          envFrom:
            - secretRef:
                name: minuspod-secrets
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          volumeMounts:
            - name: netbird-config
              mountPath: /var/lib/netbird

      volumes:
        - name: minuspod-data
          persistentVolumeClaim:
            claimName: minuspod
        - name: minuspod-assets
          persistentVolumeClaim:
            claimName: minuspod-assets
        - name: caddyfile
          configMap:
            name: minuspod-caddyfile
        - name: tls
          secret:
            secretName: minuspod-tls
        - name: netbird-config
          persistentVolumeClaim:
            claimName: minuspod-netbird-config