apiVersion: apps/v1
kind: Deployment
metadata:
  name: minuspod
  namespace: podcast
  labels:
    app: minuspod
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minuspod
  template:
    metadata:
      labels:
        app: minuspod
    spec:
      priorityClassName: batch-priority
      nodeSelector:
        kubernetes.io/hostname: s1-main01-cpwr11
      containers:
        - name: minuspod
          image: ttlequals0/minuspod:cpu
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          
          env:
            - name: MINUSPOD_MASTER_PASSPHRASE
              valueFrom:
                secretKeyRef:
                  name: minuspod-secret
                  key: master-passphrase
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minuspod-secret
                  key: app-password      
            # =================================================================
            # LLM-konfiguration (OpenRouter i Molnet)
            # =================================================================
            - name: LLM_PROVIDER
              value: "openrouter"
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: minuspod-secret
                  key: openrouter-api-key

            # =================================================================
            # Whisper-konfiguration (Lokal LocalAI via iGPU)
            # =================================================================
            - name: WHISPER_BACKEND
              value: "openai-api"
            - name: WHISPER_API_BASE_URL
              value: "http://192.168.201.120/v1"
            - name: WHISPER_API_MODEL
              value: "whisper-tiny"
            - name: WHISPER_API_KEY
              value: "not-used-but-required"

            # =================================================================
            # Serverinställningar
            # =================================================================
            - name: MINUSPOD_PORT
              value: "8000"
            - name: BASE_URL
              value: "http://192.168.201.111"

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "2"
              memory: "1Gi"

          # Lagring för poddar och databas på din Ceph-pool
          volumeMounts:
            - name: minuspod-data
              mountPath: /app/data

      volumes: # <-- SKIFTAD: Ska ha 6 mellanslag (ligga under pod-specen, i linje med containers)
        - name: minuspod-data
          persistentVolumeClaim:
            claimName: minuspod