apiVersion: apps/v1
kind: Deployment
metadata:
  name: minuspod
  namespace: podcast
  labels:
    app: minuspod
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minuspod
  template:
    metadata:
      labels:
        app: minuspod
    spec:
      priorityClassName: batch-priority
      # nodeSelector:
      #   kubernetes.io/hostname: s1-main01-cpwr11
      containers:
        - name: minuspod
          image: ttlequals0/minuspod:cpu
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          
          env:
            - name: MINUSPOD_MASTER_PASSPHRASE
              valueFrom:
                secretKeyRef:
                  name: minuspod-secret
                  key: master-passphrase
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minuspod-secret
                  key: app-password
            - name: BASE_URL
              valueFrom:
                secretKeyRef:
                  name: minuspod-secret
                  key: base-url
            - name: MINUSPOD_PORT
              value: "8000"
            - name: GUNICORN_CMD_ARGS
              value: "--access-logfile="

            - name: LLM_PROVIDER
              value: "openai"
            - name: OPENAI_BASE_URL
              value: "http://localai.localai.svc.cluster.local/v1"
            - name: OPENAI_API_KEY
              value: "not-used-but-required"
            - name: OPENAI_MODEL
              value: "qwen_qwen3.5-4b"

            - name: WHISPER_BACKEND
              value: "openai-api"
            - name: WHISPER_API_BASE_URL
              value: "http://localai.localai.svc.cluster.local/v1"
            - name: WHISPER_API_MODEL
              value: "kb-whisper-medium-q5"
            - name: WHISPER_API_KEY
              value: "not-used-but-required"

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "4"
              memory: "5Gi"

          volumeMounts:
            - name: minuspod-data
              mountPath: /app/data

      volumes:
        - name: minuspod-data
          persistentVolumeClaim:
            claimName: minuspod