---
apiVersion: v1
kind: Service
metadata:
  name: minuspod
  namespace: podcast
  annotations:
    external-dns.alpha.kubernetes.io/hostname: ${DNS_NAME_MINUSPOD}
spec:
  type: ClusterIP
  selector:
    app: minuspod
  ports:
    - port: 443
      targetPort: 443
      name: https
      protocol: TCP