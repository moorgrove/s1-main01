---
apiVersion: v1
kind: Service
metadata:
  name: minuspod
  namespace: podcast
  annotations:
    io.cilium/lb-ipam-ips: "192.168.201.111"
    tailscale.com/expose: "true"
    tailscale.com/hostname: "s1-main01-minuspod"
    tailscale.com/tls-terminate: "true"
    tailscale.com/userspace-networking: "true"
spec:
  type: LoadBalancer
  selector:
    app: minuspod
  ports:
    - port: 80
      targetPort: 8000
      name: http
      protocol: TCP