---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minuspod
  namespace: podcast
  annotations:
      kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ceph-fs-hdd-r2
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minuspod-assets
  namespace: podcast
  annotations:
      kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ceph-fs-hdd-r2
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minuspod-netbird-config
  namespace: podcast
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi