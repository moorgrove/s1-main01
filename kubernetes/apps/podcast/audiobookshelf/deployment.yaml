apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiobookshelf
  namespace: podcast
  labels:
    app: audiobookshelf
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: audiobookshelf
  template:
    metadata:
      labels:
        app: audiobookshelf
    spec:
      priorityClassName: low-priority
      automountServiceAccountToken: false
      containers:
        - name: audiobookshelf
          image: ghcr.io/advplyr/audiobookshelf:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          env:
            - name: AUDIOBOOKSHELF_UID
              value: "1000"
            - name: AUDIOBOOKSHELF_GID
              value: "1000"
            - name: SSRF_REQUEST_FILTER_WHITELIST
              value: "podcast-ad-remover"
            - name: KUBERNETES_MEMORY_LIMIT
              valueFrom:
                resourceFieldRef:
                  containerName: audiobookshelf
                  resource: limits.memory
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          volumeMounts:
            - mountPath: /config
              name: config-volume
              subPath: config
            - mountPath: /metadata
              name: config-volume
              subPath: metadata
            - mountPath: /audiobooks
              name: audiobooks-volume
      volumes:
        - name: config-volume
          persistentVolumeClaim:
            claimName: abs-config
        - name: audiobooks-volume
          persistentVolumeClaim:
            claimName: abs-audiobooks