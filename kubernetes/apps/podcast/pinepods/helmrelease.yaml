apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pinepods
  namespace: podcast
spec:
  interval: 30m
  chart:
    spec:
      chart: pinepods
      version: "0.9.0"
      sourceRef:
        kind: HelmRepository
        name: pinepods

  valuesFrom:
    - kind: Secret
      name: pinepods-secrets
      valuesKey: postgres-password
      targetPath: postgresql.auth.password
    - kind: Secret
      name: pinepods-secrets
      valuesKey: admin-username
      targetPath: env.USERNAME
    - kind: Secret
      name: pinepods-secrets
      valuesKey: admin-password
      targetPath: env.PASSWORD
    - kind: Secret
      name: pinepods-secrets
      valuesKey: admin-fullname
      targetPath: env.FULLNAME
    - kind: Secret
      name: pinepods-secrets
      valuesKey: admin-email
      targetPath: env.EMAIL
    - kind: Secret
      name: pinepods-secrets
      valuesKey: app-hostname
      targetPath: env.HOSTNAME

  values:
    image:
      repository: madeofpendletonwool/pinepods
      tag: "0.9.0"
      pullPolicy: IfNotPresent

    service:
      type: ClusterIP
      port: 8040

    podpeople:
      environment:
        ntfyUrl: ""

    ingress:
      enabled: false

    persistence:
      enabled: true
      downloads:
        storageClass: "ceph-rbd-hdd-r2"
        size: 20Gi
      backups:
        storageClass: "ceph-rbd-hdd-r2"
        size: 5Gi

    postgresql:
      enabled: true
      image:
        registry: docker.io
        repository: bitnami/postgresql
        tag: "latest"
      auth:
        username: postgres
        database: pinepods_database
      persistence:
        enabled: true
        storageClass: "ceph-rbd-hdd-r2"
        size: 5Gi

    valkey:
      enabled: true
      image:
        tag: "latest"
      architecture: standalone
      auth:
        enabled: false
      primary:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi

    env:
      DEBUG_MODE: "true"

  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Service
              name: pinepods
            patch: |-
              apiVersion: v1
              kind: Service
              metadata:
                name: pinepods
              spec:
                ports:
                  - name: http
                    port: 8040
                    targetPort: 8040
                  - name: https
                    port: 443
                    targetPort: 443

          - target:
              kind: Deployment
              name: pinepods
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: pinepods
              spec:
                template:
                  spec:
                    initContainers:
                      - name: seed-netbird-resolv
                        image: busybox:1.38
                        command:
                          - sh
                          - -c
                          - cp /etc/resolv.conf /netbird-resolv/resolv.conf
                        volumeMounts:
                          - name: netbird-resolv
                            mountPath: /netbird-resolv
                    containers:
                      - name: caddy
                        image: caddy:2.11-alpine
                        command:
                          - caddy
                          - run
                          - --config
                          - /etc/caddy/Caddyfile
                        ports:
                          - name: https
                            containerPort: 443
                        volumeMounts:
                          - name: caddyfile
                            mountPath: /etc/caddy/Caddyfile
                            subPath: Caddyfile
                            readOnly: true
                          - name: tls
                            mountPath: /certs
                            readOnly: true
                      - name: netbird
                        image: netbirdio/netbird:0.77.1
                        env:
                          - name: NB_HOSTNAME
                            value: pinepods-s1-main01
                        envFrom:
                          - secretRef:
                              name: pinepods-secrets
                        securityContext:
                          capabilities:
                            add:
                              - NET_ADMIN
                        volumeMounts:
                          - name: netbird-state
                            mountPath: /var/lib/netbird
                          - name: netbird-resolv
                            mountPath: /etc/resolv.conf
                            subPath: resolv.conf
                    volumes:
                      - name: netbird-state
                        persistentVolumeClaim:
                          claimName: pinepods-netbird-pvc
                      - name: netbird-resolv
                        emptyDir: {}
                      - name: caddyfile
                        configMap:
                          name: pinepods-caddyfile
                      - name: tls
                        secret:
                          secretName: pinepods-tls

          - target:
              kind: StatefulSet
              name: pinepods-postgresql
            patch: |-
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: pinepods-postgresql
              spec:
                template:
                  spec:
                    containers:
                      - name: postgresql
                        resources:
                          requests:
                            cpu: 50m
                            memory: 256Mi
                          limits:
                            cpu: 500m
                            memory: 1Gi