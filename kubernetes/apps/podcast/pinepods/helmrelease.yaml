---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pinepods
  namespace: podcast
spec:
  interval: 30m
  chart:
    spec:
      chart: pinepods
      version: ">=0.1.0"
      sourceRef:
        kind: HelmRepository
        name: pinepods
  
  valuesFrom:
    - kind: Secret
      name: pinepods-secrets
      valuesKey: postgres-password
      targetPath: postgresql.auth.password
    - kind: Secret
      name: pinepods-secrets
      valuesKey: admin-username
      targetPath: env.USERNAME
    - kind: Secret
      name: pinepods-secrets
      valuesKey: admin-password
      targetPath: env.PASSWORD
    - kind: Secret
      name: pinepods-secrets
      valuesKey: admin-fullname
      targetPath: env.FULLNAME
    - kind: Secret
      name: pinepods-secrets
      valuesKey: admin-email
      targetPath: env.EMAIL
    - kind: Secret
      name: pinepods-secrets
      valuesKey: app-hostname
      targetPath: env.HOSTNAME

  values:
    image:
      repository: madeofpendletonwool/pinepods
      tag: latest
      pullPolicy: IfNotPresent

    service:
      type: ClusterIP
      port: 8040
  
    podpeople:
        environment:
          ntfyUrl: ""

    ingress:
      enabled: true
      className: tailscale
      hosts:
        - host: s1-main01-pinepods
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - s1-main01-pinepods

    persistence:
      enabled: true
      downloads:
        storageClass: "ceph-fs-hdd-r2"
        size: 20Gi
      backups:
        storageClass: "ceph-fs-hdd-r2"
        size: 5Gi

    postgresql:
      enabled: true
      image:
        tag: "18.7.8"
      auth:
        username: postgres
        database: pinepods_database
      persistence:
        enabled: true
        storageClass: "ceph-fs-hdd-r2"
        size: 5Gi

    valkey:
      enabled: true
      image:
        tag: "latest"
      architecture: standalone
      auth:
        enabled: false

    env:
      DEBUG_MODE: "false"