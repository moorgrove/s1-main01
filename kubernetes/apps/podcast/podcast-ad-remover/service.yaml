---
apiVersion: v1
kind: Service
metadata:
  name: podcast-ad-remover
  namespace: podcast
  annotations:
    io.cilium/lb-ipam-ips: "192.168.201.110"
spec:
  type: LoadBalancer
  selector:
    app: podcast-ad-remover
  ports:
    - port: 80
      targetPort: 8000
      name: http
      protocol: TCP