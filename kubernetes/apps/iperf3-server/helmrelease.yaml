apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: iperf3
  namespace: iperf3-server
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
  values:
    controllers:
      iperf3:
        containers:
          app:
            image:
              repository: networkstatic/iperf3
              tag: latest
            args: ["-s"]

    service:
      main:
        controller: iperf3
        type: ClusterIP
        annotations:
          external-dns.alpha.kubernetes.io/hostname: ${DNS_NAME_IPERF3_SERVER}
        ports:
          tcp:
            port: 5201
            protocol: TCP
          udp:
            port: 5201
            protocol: UDP