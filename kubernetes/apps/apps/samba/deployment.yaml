apiVersion: apps/v1
kind: Deployment
metadata:
  name: samba
  namespace: samba
spec:
  replicas: 1
  selector:
    matchLabels:
      app: samba
  template:
    metadata:
      labels:
        app: samba
    spec:
      priorityClassName: medium-priority
      initContainers:
        - name: fix-cephfs-permissions
          image: alpine:latest
          resources:
            requests:
              cpu: 500m
              memory: 500Mi
            limits:
              cpu: 1000m
              memory: 1000Mi
          command: ["sh", "-c", "chmod 777 /mnt/ceph && chown 1000:1000 /mnt/ceph"]
          volumeMounts:
            - name: vol-andreas
              mountPath: /mnt/tm-claes-hedlund
            - name: vol-evert
              mountPath: /mnt/tm-asa-hedlund
      containers:
        - name: samba
          image: dperson/samba:latest
          resources:
            requests:
              cpu: 1000m
              memory: 500Mi
            limits:
              cpu: 2000m
              memory: 1000Mi
          env:
            - name: PASS_CLAES_HEDLUND
              valueFrom:
                secretKeyRef:
                  name: samba-auth
                  key: pass_claes_hedlund
            - name: PASS_ASA_HEDLUND
              valueFrom:
                secretKeyRef:
                  name: samba-auth
                  key: pass_asa_hedlund
          args:
            - "-u"
            - "andreas;$(PASS_CLAES_HEDLUND)"
            - "-u"
            - "evert;$(PASS_ASA_HEDLUND)"

            - "-s"
            - "TM-Claes Hedlund;/mnt/tm-claes-hedlund;yes;no;no;claes_hedlund"
            - "-s"
            - "TM-Asa Hedlund;/mnt/tm-asa-hedlund;yes;no;no;asa_hedlund"

            - "-g"
            - "vfs objects = fruit streams_xattr"
            - "-g"
            - "fruit:aapl = yes"
            - "-g"
            - "fruit:time machine = yes"
          ports:
            - containerPort: 445
              name: smb
          volumeMounts:
            - name: vol-claes-hedlund
              mountPath: /mnt/tm-claes-hedlund
            - name: vol-asa-hedlund
              mountPath: /mnt/tm-asa-hedlund
      volumes:
        - name: vol-claes-hedlund
          persistentVolumeClaim:
            claimName: samba-tm-claes-hedlund-pvc
        - name: vol-asa-hedlund
          persistentVolumeClaim:
            claimName: samba-tm-asa-hedlund-pvc