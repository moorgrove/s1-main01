apiVersion: v1
kind: Service
metadata:
  name: rook-ceph-mgr-dashboard-local
  namespace: rook-ceph
  annotations:
    io.cilium/lb-ipam-ips: "192.168.201.100"
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: 7000
      protocol: TCP
  selector:
    app: rook-ceph-mgr
    mgr_role: active