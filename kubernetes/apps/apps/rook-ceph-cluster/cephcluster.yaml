---
apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  cephVersion:
    image: quay.io/ceph/ceph:v19.2.3
    allowUnsupported: false
  dataDirHostPath: /var/lib/rook
  priorityClassNames:
    mon: high-priority
    osd: low-priority
    prepareosd: low-priority
    mgr: high-priority
    crashcollector: low-priority
    exporter: low-priority
  cephConfig:
    global:
      osd_memory_target: "1073741824"    # 1GB per OSD
      osd_memory_base: "268435456"       # 256MB base memory
      osd_memory_cache_min: "134217728"  # 128MB cache minimum
      bluestore_cache_size: "536870912"  # 512MB bluestore cache size
  mon:
    count: 1
    allowMultiplePerNode: true
  mgr:
    count: 1
    allowMultiplePerNode: true
  dashboard:
    enabled: true
    ssl: false
  storage:
    useAllNodes: false
    useAllDevices: false
    nodes:
      - name: s1-main01-cpwr01
        devices:
          - name: /dev/disk/by-id/50014ee217016a21
          - name: /dev/disk/by-id/5000039da8d00a9a
          - name: /dev/disk/by-id/001b448b4b44c26c