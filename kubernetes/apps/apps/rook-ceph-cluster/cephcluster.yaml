---
apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  cephVersion:
    image: quay.io/ceph/ceph:v19.2.3
    allowUnsupported: false
  dataDirHostPath: /var/lib/rook
  cephConfig:
    global:
      osd_memory_target: "1073741824"
  mon:
    count: 1
    allowMultiplePerNode: true
  mgr:
    count: 1
    allowMultiplePerNode: true
  dashboard:
    enabled: true
    ssl: false
  resources:
    prepareosd:
      requests:
        memory: 128Mi
        cpu: "100m"
      limits:
        memory: 256Mi
        cpu: "200m"
    osd:
      requests:
        memory: 1Gi
        cpu: "500m"
      limits:
        memory: 1500Mi
        cpu: "1000m"
    mon:
      requests:
        memory: 128Mi
        cpu: "100m"
      limits:
        memory: 256Mi
        cpu: "200m"
    mgr:
      requests:
        memory: 128Mi
        cpu: "100m"
      limits:
        memory: 512Mi
        cpu: "300m"
  storage:
    useAllNodes: false
    useAllDevices: false
    nodes:
      - name: s1-main01-cpwr01
        devices:
          - name: /dev/disk/by-id/wwn-0x50014ee217016a21
          - name: /dev/disk/by-id/wwn-0x5000039da8d00a9a
          - name: /dev/disk/by-id/nvme-eui.001b448b4b44c26c