---
apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  cephVersion:
    image: quay.io/ceph/ceph:v19.2.3
    allowUnsupported: false
  dataDirHostPath: /var/lib/rook
  mon:
    count: 1
    allowMultiplePerNode: true
  mgr:
    count: 1
    allowMultiplePerNode: true
  dashboard:
    enabled: true
    ssl: false
  resources:
    prepareosd:
      requests:
        memory: 128Mi
        cpu: "250m"
      limits:
        memory: 256Mi
        cpu: "500m"
    osd:
      requests:
        memory: 128Mi
        cpu: "250m"
      limits:
        memory: 256Mi
        cpu: "500m"
    mon:
      requests:
        memory: 128Mi
        cpu: "250m"
      limits:
        memory: 256Mi
        cpu: "500m"
    mgr:
      requests:
        memory: 128Mi
        cpu: "250m"
      limits:
        memory: 256Mi
        cpu: "500m"
  storage:
    useAllNodes: false
    useAllDevices: false
    nodes:
      - name: s1-main01-cpwr01
        devices:
          - name: /dev/disk/by-id/wwn-0x50014ee217016a21
          - name: /dev/disk/by-id/wwn-0x5000039da8d00a9a
          - name: /dev/disk/by-id/001b448b4b44c26c
  
  cephBlockPools: []
  cephFileSystems: []
  cephObjectStores: []