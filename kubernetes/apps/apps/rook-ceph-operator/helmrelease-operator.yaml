---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  interval: 30m
  chart:
    spec:
      chart: rook-ceph
      version: "v1.19.5"
      sourceRef:
        kind: HelmRepository
        name: rook-release
        namespace: flux-system
  values:
    monitoring:
      enabled: false
    csi:
      csiRBDProvisionerResource:
        limits:
          cpu: "250m"
          memory: "256Mi"
        requests:
          cpu: "100m"
          memory: "128Mi"
      csiRBDPluginResource:
        limits:
          cpu: "250m"
          memory: "256Mi"
        requests:
          cpu: "100m"
          memory: "128Mi"
    resources:
      limits:
        cpu: "200m"
        memory: "256Mi"
      requests:
        cpu: "100m"
        memory: "128Mi"