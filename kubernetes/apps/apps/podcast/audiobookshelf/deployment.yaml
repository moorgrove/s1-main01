apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiobookshelf
  namespace: podcast
  labels:
    app: audiobookshelf
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: audiobookshelf
  template:
    metadata:
      labels:
        app: audiobookshelf
    spec:
      priorityClassName: low-priority
      containers:
        - name: audiobookshelf
          image: ghcr.io/advplyr/audiobookshelf:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          env:
            - name: AUDIOBOOKSHELF_UID
              value: "1000"
            - name: AUDIOBOOKSHELF_GID
              value: "1000"
            - name: DISABLE_SSRF_REQUEST_FILTER
              value: "1"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          volumeMounts:
            - mountPath: /config
              name: config-volume
              subPath: config
            - mountPath: /metadata
              name: config-volume
              subPath: metadata
            - mountPath: /audiobooks
              name: audiobooks-volume
      volumes:
        - name: config-volume
          persistentVolumeClaim:
            claimName: abs-config
        - name: audiobooks-volume
          persistentVolumeClaim:
            claimName: abs-audiobooks