apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: iperf3-server
  namespace: iperf3
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
  values:
    controllers:
      iperf3:
        containers:
          app:
            image:
              repository: frauhottelmann/docker-iperf3
              tag: "3.19"
            args: ["-s"]

          netbird:
            image:
              repository: netbirdio/netbird
              tag: 0.76.3
            env:
              NB_HOSTNAME: iperf3-server-s1-main01
            envFrom:
              - secretRef:
                  name: iperf3-secrets
            securityContext:
              capabilities:
                add:
                  - NET_ADMIN

    service:
      main:
        controller: iperf3
        type: ClusterIP
        ports:
          tcp:
            port: 5201
            protocol: TCP
          udp:
            port: 5201
            protocol: UDP

    persistence:
      netbird-state:
        existingClaim: iperf3-netbird
        advancedMounts:
          iperf3:
            netbird:
              - path: /var/lib/netbird