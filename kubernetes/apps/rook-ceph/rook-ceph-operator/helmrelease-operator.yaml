---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  interval: 30m
  chart:
    spec:
      chart: rook-ceph
      version: "v1.20.3"
      sourceRef:
        kind: HelmRepository
        name: rook-release
        namespace: flux-system
  values:
    monitoring:
      enabled: true
      createPrometheusRules: true
    config:
      mgr:
        mgr/dashboard/prometheus_api_host: "http://kube-prometheus-stack-prometheus.monitoring.svc:9090"
        mgr/dashboard/alertmanager_api_host: "http://kube-prometheus-stack-alertmanager.monitoring.svc:9093"
    csi:
      priorityClassName: urgent-priority
      provisionerPriorityClassName: urgent-priority
      pluginPriorityClassName: urgent-priority