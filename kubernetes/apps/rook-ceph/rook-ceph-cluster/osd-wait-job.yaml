---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rook-ceph-osd-waiter
  namespace: rook-ceph
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rook-ceph-osd-waiter-role
  namespace: rook-ceph
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rook-ceph-osd-waiter-binding
  namespace: rook-ceph
subjects:
  - kind: ServiceAccount
    name: rook-ceph-osd-waiter
roleRef:
  kind: Role
  name: rook-ceph-osd-waiter-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: wait-for-osd-ready
  namespace: rook-ceph
spec:
  ttlSecondsAfterFinished: 60
  backoffLimit: 4
  template:
    spec:
      serviceAccountName: rook-ceph-osd-waiter
      restartPolicy: OnFailure
      containers:
        - name: wait
          image: bitnami/kubectl:latest
          command:
            - /bin/bash
            - -c
            - |
              echo "Waiting for Rook operator to create OSD pods..."

              while [[ $(kubectl get pods -n rook-ceph -l app=rook-ceph-osd --no-headers 2>/dev/null | wc -l) -eq 0 ]]; do
                echo "No OSD pods found yet. Waiting 10 seconds..."
                sleep 10
              done

              echo "OSD pods found! Waiting for all pods to become Ready..."

              kubectl wait --for=condition=Ready pod -l app=rook-ceph-osd -n rook-ceph --timeout=30m

              echo "All OSD pods are Ready. Cluster is ready for storage pools."
