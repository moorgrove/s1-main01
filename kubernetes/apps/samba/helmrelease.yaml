apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: samba
  namespace: samba
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      priorityClassName: medium-priority
      terminationGracePeriodSeconds: 60

    controllers:
      main:
        type: deployment
        strategy: Recreate
        
        initContainers:
          fix-permissions:
            image:
              repository: alpine
              tag: latest
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 100m
                memory: 128Mi
            command:
              - sh
              - -c
              - |
                chmod 777 /mnt/nas \
                          /mnt/backup-andreas-hedlund-mac-mini \
                          /mnt/backup-claes-hedlund-macbook \
                          /mnt/backup-johanna-hedlund-macbook \
                          /mnt/backup-asa-hedlund-macbook \
                          /mnt/backup-ha-lahalla \
                          /mnt/backup-ha-johanna

        containers:
          main:
            image:
              repository: ghcr.io/servercontainers/samba
              tag: latest
            securityContext:
              capabilities:
                add:
                  - NET_ADMIN
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                cpu: 1000m
                memory: 2Gi
            env:
              SAMBA_CONF_WORKGROUP: "WORKGROUP"
              SAMBA_CONF_SERVER_STRING: "Samba-s1-main01"
              SAMBA_CONF_MAP_TO_GUEST: "Bad User"
              SAMBA_CONF_LOG_LEVEL: "1"
              ACCOUNT_andreas_hedlund:
                valueFrom:
                  secretKeyRef:
                    name: samba-auth
                    key: pass_andreas_hedlund
              UID_andreas_hedlund: "1004"
              ACCOUNT_andreas_hedlund_backup_mac_mini:
                valueFrom:
                  secretKeyRef:
                    name: samba-auth
                    key: pass_andreas_hedlund_backup_mac_mini
              UID_andreas_hedlund_backup_mac_mini: "1001"
              ACCOUNT_claes_hedlund_backup_macbook:
                valueFrom:
                  secretKeyRef:
                    name: samba-auth
                    key: pass_claes_hedlund_backup_macbook
              UID_claes_hedlund_backup_macbook: "1002"
              ACCOUNT_johanna_hedlund:
                valueFrom:
                  secretKeyRef:
                    name: samba-auth
                    key: pass_johanna_hedlund
              UID_johanna_hedlund: "1005"
              ACCOUNT_ha_lahalla:
                valueFrom:
                  secretKeyRef:
                    name: samba-auth
                    key: pass_ha_lahalla
              UID_ha_lahalla: "1003"
              ACCOUNT_ha_johanna:
                valueFrom:
                  secretKeyRef:
                    name: samba-auth
                    key: pass_ha_johanna
              UID_ha_johanna: "1000"
              ACCOUNT_asa_hedlund_backup_macbook:
                valueFrom:
                  secretKeyRef:
                    name: samba-auth
                    key: pass_asa_hedlund_backup_macbook
              UID_asa_hedlund_backup_macbook: "1007"
            ports:
              - name: smb
                containerPort: 445

          netbird:
            image:
              repository: netbirdio/netbird
              tag: 0.79.0
            env:
              NB_HOSTNAME: samba-s1-main01
            envFrom:
              - secretRef:
                  name: samba-netbird-secrets
            securityContext:
              capabilities:
                add:
                  - NET_ADMIN

    service:
      main:
        controller: main
        type: LoadBalancer
        annotations:
          io.cilium/lb-ipam-ips: "192.168.201.101"
        ports:
          smb:
            port: 445
            protocol: TCP

    configMaps:
      samba-config:
        enabled: true
        data:
          smb.conf: |
            [global]
               workgroup = WORKGROUP
               netbios name = SAMBA-NAS
               server string = Samba-s1-main01
               server role = standalone server
               log level = 1
               map to guest = Bad User
               usershare allow guests = no

               # Globala Apple / macOS / VFS Fruit-optimeringar
               vfs objects = fruit streams_xattr
               fruit:aapl = yes
               fruit:time machine = yes
               fruit:model = Macpro
               fruit:metadata = stream
               fruit:posix_rename = yes
               fruit:zero_file_id = yes
               fruit:wipe_intentionally_left_blank_rfork = yes
               fruit:delete_empty_adfiles = yes

            [NAS]
               path = /mnt/nas
               browseable = yes
               read only = no
               valid users = andreas_hedlund

            [backup-andreas-hedlund-mac-mini]
               path = /mnt/backup-andreas-hedlund-mac-mini
               browseable = yes
               read only = no
               valid users = andreas_hedlund_backup_mac_mini

            [backup-claes-hedlund-macbook]
               path = /mnt/backup-claes-hedlund-macbook
               browseable = yes
               read only = no
               valid users = claes_hedlund_backup_macbook

            [backup-johanna-hedlund-macbook]
               path = /mnt/backup-johanna-hedlund-macbook
               browseable = yes
               read only = no
               valid users = johanna_hedlund

            [backup-ha-lahalla]
               path = /mnt/backup-ha-lahalla
               browseable = yes
               read only = no
               valid users = ha_lahalla

            [backup-ha-johanna]
               path = /mnt/backup-ha-johanna
               browseable = yes
               read only = no
               valid users = ha_johanna

            [backup-asa-hedlund-macbook]
               path = /mnt/backup-asa-hedlund-macbook
               browseable = yes
               read only = no
               valid users = asa_hedlund_backup_macbook

    persistence:
      config:
        type: configMap
        name: samba
        advancedMounts:
          main:
            main:
              - path: /container/config/samba/smb.conf
                subPath: smb.conf
      netbird-state:
        existingClaim: samba-netbird
        advancedMounts:
          main:
            netbird:
              - path: /var/lib/netbird

      vol-nas:
        type: persistentVolumeClaim
        existingClaim: nas
        globalMounts:
          - path: /mnt/nas
      vol-backup-andreas-hedlund-mac-mini:
        type: persistentVolumeClaim
        existingClaim: backup-andreas-hedlund-mac-mini
        globalMounts:
          - path: /mnt/backup-andreas-hedlund-mac-mini
      vol-backup-claes-hedlund-macbook:
        type: persistentVolumeClaim
        existingClaim: backup-claes-hedlund-macbook
        globalMounts:
          - path: /mnt/backup-claes-hedlund-macbook
      vol-backup-johanna-hedlund-macbook:
        type: persistentVolumeClaim
        existingClaim: backup-johanna-hedlund-macbook
        globalMounts:
          - path: /mnt/backup-johanna-hedlund-macbook
      vol-backup-ha-lahalla:
        type: persistentVolumeClaim
        existingClaim: backup-ha-lahalla
        globalMounts:
          - path: /mnt/backup-ha-lahalla
      vol-backup-ha-johanna:
        type: persistentVolumeClaim
        existingClaim: backup-ha-johanna
        globalMounts:
          - path: /mnt/backup-ha-johanna
      vol-backup-asa-hedlund-macbook:
        type: persistentVolumeClaim
        existingClaim: backup-asa-hedlund-macbook
        globalMounts:
          - path: /mnt/backup-asa-hedlund-macbook