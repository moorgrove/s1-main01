---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbird-exit-node
  namespace: netbird
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netbird-exit-node
  template:
    metadata:
      labels:
        app: netbird-exit-node
    spec:
      hostNetwork: false
      containers:
      - name: netbird
        image: netbirdio/netbird:0.75.0
        securityContext:
          privileged: false
          capabilities:
            add: ["NET_ADMIN", "NET_RAW"]
            drop: ["ALL"]
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"
        env:
        - name: NB_SETUP_KEY
          valueFrom:
            secretKeyRef:
              name: netbird-exit-node-secret
              key: NB-SETUP-KEY
        - name: NB_MANAGEMENT_URL
          valueFrom:
            secretKeyRef:
              name: netbird-exit-node-secret
              key: NB-MANAGEMENT-URL
        - name: NB_HOSTNAME
          value: "exit-node-s1-main01"
        volumeMounts:
        - name: netbird-config
          mountPath: /etc/netbird
        - name: dev-net-tun
          mountPath: /dev/net/tun
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/sh
              - -c
              - |
                set -e
                CHAIN="NETBIRD-EXIT-FWD"
                DEFAULT_IFACE=$(ip route show default | awk '/default/ {print $5; exit}')

                sysctl -w net.ipv4.ip_forward=1 2>/dev/null || true
                sysctl -w net.ipv6.conf.all.forwarding=0 2>/dev/null || true

                iptables -N "$CHAIN" 2>/dev/null || iptables -F "$CHAIN"

                iptables -C FORWARD -i wt+ -j "$CHAIN" 2>/dev/null || \
                  iptables -I FORWARD 1 -i wt+ -j "$CHAIN"

                iptables -A "$CHAIN" -m state --state RELATED,ESTABLISHED -j ACCEPT
                iptables -A "$CHAIN" -d 169.254.0.0/16 -j DROP   # link-local / metadata
                iptables -A "$CHAIN" -d 10.0.0.0/8 -j DROP
                iptables -A "$CHAIN" -d 172.16.0.0/12 -j DROP
                iptables -A "$CHAIN" -d 192.168.0.0/16 -j DROP
                iptables -A "$CHAIN" -j ACCEPT

                iptables -t nat -C POSTROUTING -o "$DEFAULT_IFACE" -j MASQUERADE 2>/dev/null || \
                  iptables -t nat -A POSTROUTING -o "$DEFAULT_IFACE" -j MASQUERADE
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - |
                CHAIN="NETBIRD-EXIT-FWD"
                DEFAULT_IFACE=$(ip route show default | awk '/default/ {print $5; exit}')
                iptables -D FORWARD -i wt+ -j "$CHAIN" 2>/dev/null || true
                iptables -F "$CHAIN" 2>/dev/null || true
                iptables -X "$CHAIN" 2>/dev/null || true
                iptables -t nat -D POSTROUTING -o "$DEFAULT_IFACE" -j MASQUERADE 2>/dev/null || true
      volumes:
      - name: netbird-config
        persistentVolumeClaim:
          claimName: netbird-exit-node-pvc
      - name: dev-net-tun
        hostPath:
          path: /dev/net/tun
          type: CharDevice