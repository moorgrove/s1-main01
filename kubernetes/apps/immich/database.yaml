apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-postgres
  namespace: immich
spec:
  instances: 1
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:16.9-0.4.3
  postgresql:
    shared_preload_libraries:
      - "vchord.so"
  bootstrap:
    initdb:
      database: immich
      owner: immich
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
        - CREATE EXTENSION IF NOT EXISTS earthdistance CASCADE;
        - ALTER ROLE immich WITH SUPERUSER;
  storage:
    size: 20Gi
    storageClass: ceph-rbd-hdd-r2
  backup:
    barmanObjectStore:
      destinationPath: ${BARMAN_DESTINATION_PATH}
      endpointURL: ${BARMAN_ENDPOINT_URL}
      s3Credentials:
        accessKeyId:
          name: immich-database-barman-secret
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: immich-database-barman-secret
          key: AWS_SECRET_ACCESS_KEY