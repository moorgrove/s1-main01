apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 30m
  chart:
    spec:
      chart: immich
      version: "0.13.1"
      sourceRef:
        kind: HelmRepository
        name: immich
        namespace: immich
  values:
    controllers:
      main:
        containers:
          main:
            env:
              TZ: Europe/Stockholm
              DB_HOSTNAME: immich-postgres-rw
              DB_DATABASE_NAME: immich
              DB_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: immich-postgres-app
                    key: username
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-postgres-app
                    key: password

    immich:
      persistence:
        library:
          existingClaim: immich-library

      # configuration:
      #   ffmpeg:
      #     accel: vaapi
      #     targetDevices:
      #       - /dev/dri/renderD128

    valkey:
      enabled: true
      controllers:
        main:
          containers:
            main:
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi

    server:
      enabled: true
      controllers:
        main:
          pod:
            nodeSelector:
              kubernetes.io/hostname: s1-main01-cpwr11
            # securityContext:
            #   supplementalGroups:
            #     - REPLACE_WITH_RENDER_GID
          containers:
            main:
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  memory: 4Gi

            netbird:
              image:
                repository: netbirdio/netbird
                tag: 0.76.2
              env:
                NB_HOSTNAME: immich-s1-main01
              envFrom:
                - secretRef:
                    name: immich-netbird-secrets
              securityContext:
                capabilities:
                  add:
                    - NET_ADMIN

            caddy:
              image:
                repository: caddy
                tag: "2"
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 100m
                  memory: 128Mi

      ingress:
        main:
          enabled: false

      persistence:
        # dri:
        #   type: hostPath
        #   hostPath: /dev/dri
        #   hostPathType: Directory
        #   advancedMounts:
        #     main:
        #       main:
        #         - path: /dev/dri
        #       netbird: []

        netbird-data:
          type: persistentVolumeClaim
          existingClaim: immich-netbird
          advancedMounts:
            main:
              netbird:
                - path: /var/lib/netbird

        caddy-config:
          type: configMap
          name: immich-caddy-config
          advancedMounts:
            main:
              caddy:
                - path: /etc/caddy/Caddyfile
                  subPath: Caddyfile

        caddy-tls:
          type: secret
          name: immich-tls
          advancedMounts:
            main:
              caddy:
                - path: /certs
                  readOnly: true

    machine-learning:
      enabled: true
      controllers:
        main:
          containers:
            main:
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  memory: 4Gi