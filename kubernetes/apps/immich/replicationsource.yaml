apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: immich-library
  namespace: immich
spec:
  sourcePVC: immich-library
  trigger:
    schedule: "0 2 * * *"
  restic:
    copyMethod: Snapshot
    volumeSnapshotClassName: csi-cephrbdplugin-snapclass
    repository: immich-library-volsync-secret
    pruneIntervalDays: 28
    cacheAccessModes:
      - ReadWriteOnce
    cacheCapacity: 2Gi
    storageClassName: ceph-rbd-hdd-r2
    moverSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    retain:
      hourly: 24
      daily: 7
      weekly: 4
      monthly: 12
      yearly: 3