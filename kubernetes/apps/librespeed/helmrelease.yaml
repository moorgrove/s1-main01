apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: librespeed
  namespace: librespeed
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
  values:
    controllers:
      librespeed:
        containers:
          app:
            image:
              repository: linuxserver/librespeed
              tag: 5.4.1
            env:
              TZ: Europe/Stockholm
              PUID: 1000
              PGID: 1000
    service:
      main:
        controller: librespeed
        type: ClusterIP
        ports:
          http:
            port: 80
    ingress:
      main:
        enabled: true
        className: cilium
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-production
        hosts:
          - host: ${LIBRESPEED_HOST}
            paths:
              - path: /
                service:
                  identifier: main
                  port: http
        tls:
          - secretName: librespeed-tls
            hosts:
              - ${LIBRESPEED_HOST}