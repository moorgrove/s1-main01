apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: librespeed
  namespace: librespeed
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
  values:
    controllers:
      librespeed:
        containers:
          app:
            image:
              repository: ghcr.io/librespeed/speedtest
              tag: 5.4.1
            env:
              TZ: Europe/Stockholm
          caddy:
            image:
              repository: caddy
              tag: 2.9-alpine
            command:
              - caddy
              - run
              - --config
              - /etc/caddy/Caddyfile
            ports:
              - name: https
                containerPort: 443
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
    service:
      main:
        controller: librespeed
        type: ClusterIP
        ports:
          https:
            port: 443
            targetPort: 443
    persistence:
      caddyfile:
        type: configMap
        name: librespeed-caddyfile
        advancedMounts:
          librespeed:
            caddy:
              - path: /etc/caddy/Caddyfile
                subPath: Caddyfile
                readOnly: true
      tls:
        type: secret
        name: librespeed-tls
        advancedMounts:
          librespeed:
            caddy:
              - path: /certs
                readOnly: true