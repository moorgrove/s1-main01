apiVersion: cilium.io/v2
kind: CiliumEgressGatewayPolicy
metadata:
  name: exit-node-egress-path
spec:
  selectors:
    - podSelector:
        matchLabels:
          app: exit-node
          io.kubernetes.pod.namespace: tailscale-exit
  destinationCIDRs:
    - "0.0.0.0/0"
  excludedCIDRs:
    - "10.244.0.0/16"
  egressGateway:
    nodeSelector:
      matchLabels:
        egress-vlan30: "true"
    interface: ethSel0.30