---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tailscale-exit-sa
  namespace: tailscale-exit
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tailscale-exit-role
  namespace: tailscale-exit
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tailscale-exit-binding
  namespace: tailscale-exit
subjects:
  - kind: ServiceAccount
    name: tailscale-exit-sa
roleRef:
  kind: Role
  name: tailscale-exit-role
  apiGroup: rbac.authorization.k8s.io