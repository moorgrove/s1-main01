---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: operator
  namespace: tailscale-exit
spec:
  interval: 10m
  targetNamespace: tailscale-exit
  chart:
    spec:
      chart: tailscale-operator
      version: "1.96.5"
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: flux-system
  values:
    installCRDs: true
  valuesFrom:
    - kind: Secret
      name: operator-oauth
      valuesKey: client-id
      targetPath: oauth.clientId
    - kind: Secret
      name: operator-oauth
      valuesKey: client-secret
      targetPath: oauth.clientSecret