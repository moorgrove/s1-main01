---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale-exit
  namespace: tailscale-exit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: exit-node
  template:
    metadata:
      labels:
        app: exit-node
    spec:
      serviceAccountName: tailscale-exit-sa
      priorityClassName: batch-priority
      nodeSelector:
        kubernetes.io/hostname: s1-main01-cpwr11
      initContainers:
      - name: enable-ip-forwarding
        image: busybox:1.36
        command:
        - sh
        - -c
        - sysctl -w net.ipv4.ip_forward=1 net.ipv6.conf.all.forwarding=1
        securityContext:
          privileged: true
      containers:
      - name: tailscale
        image: tailscale/tailscale:v1.98.5
        env:
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              name: tailscale-auth
              key: TS_AUTHKEY
        - name: TS_HOSTNAME
          value: "s1-exit-node"
        - name: TS_EXTRA_ARGS
          value: "--advertise-exit-node --accept-dns=false --netfilter-mode=off"
        - name: TS_USERSPACE
          value: "false"
        - name: TS_KUBE_SECRET
          value: "tailscale-exit-state"
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
        volumeMounts:
        - name: tun
          mountPath: /dev/net/tun
        lifecycle:
          postStart:
            exec:
              command:
                - /bin/sh
                - -c
                - "iptables -t nat -A POSTROUTING -o ethSel0 -j MASQUERADE"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
      volumes:
      - name: tun
        hostPath:
          path: /dev/net/tun
          type: CharDevice