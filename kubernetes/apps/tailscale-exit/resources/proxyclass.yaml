apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: infra-node-allowed
  namespace: tailscale-exit
spec:
  statefulSet:
    pod:
      tolerations:
        - key: "node-role/infra-only"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      tailscaleContainer:
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"