apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale-exit
  namespace: flux-system
spec:
  dependsOn:
    - name: tailscale-operator
  interval: 15m
  path: ./kubernetes/apps/tailscale-exit
  wait: true
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  