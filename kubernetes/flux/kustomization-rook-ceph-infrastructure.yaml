---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rook-ceph-infrastructure
  namespace: flux-system
spec:
  dependsOn:
    - name: cilium-infrastructure
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/infrastructure/rook-ceph
  prune: true
  wait: true
  timeout: 30m