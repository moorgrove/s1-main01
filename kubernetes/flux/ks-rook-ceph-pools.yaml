---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rook-ceph-pools
  namespace: flux-system
spec:
  dependsOn:
    - name: rook-ceph-cluster
  interval: 60m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/rook-ceph/rook-ceph-pools
  prune: false
  wait: true
  timeout: 30m
  decryption:
    provider: sops
    secretRef:
      name: sops-age