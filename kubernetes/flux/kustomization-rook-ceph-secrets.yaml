apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
    name: rook-ceph-secrets
    namespace: flux-system
spec:
    interval: 10m
    sourceRef:
        kind: GitRepository
        name: flux-system
    path: ./kubernetes/apps/apps/rook-ceph-cluster/secrets
    prune: false
    wait: true
    timeout: 5m
    decryption:
        provider: sops
        secretRef:
            name: sops-age
