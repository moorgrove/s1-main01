apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: volsync
  namespace: flux-system
spec:
  dependsOn:
    - name: rook-ceph-operator
  interval: 15m
  path: ./kubernetes/infrastructure/volsync
  wait: true
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system