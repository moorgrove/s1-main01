apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: netbird-exit-node
  namespace: flux-system
spec:
  interval: 15m
  path: ./kubernetes/apps/netbird-exit-node
  wait: true
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  