apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: streaming
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/apps/streaming
  prune: false
  wait: true
  timeout: 30m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cnpg-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-streaming-secrets