---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: iperf3
  namespace: flux-system
spec:
  interval: 60m
  path: ./kubernetes/apps/iperf3
  prune: true
  wait: true
  timeout: 30m
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-iperf3-secrets
  decryption:
    provider: sops
    secretRef:
      name: sops-age