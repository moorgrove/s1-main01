---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: victoriametrics
  namespace: flux-system
spec:
  interval: 60m
  path: ./kubernetes/apps/victoriametrics
  prune: false
  wait: false
  timeout: 30m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age