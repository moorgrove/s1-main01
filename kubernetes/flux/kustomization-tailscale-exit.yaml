---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale-exit
  namespace: flux-system
spec:
  dependsOn:
    - name: cilium-infrastructure
  interval: 60m
  path: ./kubernetes/apps/tailscale-exit
  prune: true
  wait: true
  timeout: 30m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
        name: sops-age