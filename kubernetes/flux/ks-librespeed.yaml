---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: librespeed
  namespace: flux-system
spec:
  interval: 60m
  path: ./kubernetes/apps/librespeed
  prune: true
  wait: true
  timeout: 30m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: netbird-operator
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-librespeed-secrets