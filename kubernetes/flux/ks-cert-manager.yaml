---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/infrastructure/cert-manager
  prune: true
  wait: true
  timeout: 10m
  dependsOn:
    - name: cilium-infrastructure
    - name: flux-system
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cert-manager-cluster-issuer-secrets
  decryption:
    provider: sops
    secretRef:
      name: sops-age