apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: netbird-operator
  namespace: flux-system
spec:
  dependsOn:
    - name: cilium-infrastructure
    - name: cert-manager
  interval: 15m
  path: ./kubernetes/infrastructure/netbird-operator
  wait: true
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-netbird-secrets