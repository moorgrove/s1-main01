---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: samba-app
  namespace: flux-system
spec:
  dependsOn:
    - name: cilium-infrastructure
    - name: rook-ceph-pools
    - name: storage-infrastructure
  interval: 60m
  path: ./kubernetes/apps/apps/samba
  prune: true
  wait: true
  timeout: 30m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age