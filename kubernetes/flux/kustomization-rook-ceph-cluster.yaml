---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: rook-ceph-cluster
  namespace: flux-system
spec:
  dependsOn:
    - name: rook-ceph-operator
    - name: rook-ceph-secrets
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/apps/apps/rook-ceph-cluster
  prune: false
  wait: true
  timeout: 30m
  decryption:
    provider: sops
    secretRef:
      name: sops-age