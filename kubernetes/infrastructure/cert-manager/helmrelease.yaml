---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  chart:
    spec:
      chart: cert-manager
      version: "v1.20.1"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
  values:
    installCRDs: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-webhook-desec
  namespace: cert-manager
spec:
  interval: 1h
  chart:
    spec:
      chart: ./deploy/cert-manager-webhook-desec
      sourceRef:
        kind: GitRepository
        name: cert-manager-webhook-desec
        namespace: cert-manager
  values:
    groupName: acme.desec.io