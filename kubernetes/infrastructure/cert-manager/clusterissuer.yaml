apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
  namespace: cert-manager
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ${ACME_EMAIL}
    privateKeySecretRef:
      name: letsencrypt-production-account-key
    solvers:
      - dns01:
          webhook:
            groupName: acme.loopia.se
            solverName: loopia
            config:
              usernameSecretRef:
                name: cert-manager-loopia-secrets
                key: username
              passwordSecretRef:
                name: cert-manager-loopia-secrets
                key: password