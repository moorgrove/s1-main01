apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "88.6.3"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    createNamespace: true
    crds: Create
  upgrade:
    crds: CreateReplace
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: kube-prometheus-stack-grafana
            patch: |
              - op: add
                path: /spec/template/spec/initContainers
                value:
                  - name: init-resolv-conf
                    image: busybox:1.38
                    command:
                      - sh
                      - -c
                      - cp /etc/resolv.conf /resolv-conf/resolv.conf
                    volumeMounts:
                      - name: resolv-conf
                        mountPath: /resolv-conf

              - op: add
                path: /spec/template/spec/containers/-
                value:
                  name: netbird
                  image: netbirdio/netbird:0.77.0
                  env:
                    - name: NB_HOSTNAME
                      value: grafana-s1-main01
                  envFrom:
                    - secretRef:
                        name: grafana-netbird-secrets
                  securityContext:
                    runAsUser: 0
                    runAsGroup: 0
                    runAsNonRoot: false
                    capabilities:
                      add:
                        - NET_ADMIN
                  volumeMounts:
                    - name: resolv-conf
                      mountPath: /etc/resolv.conf
                      subPath: resolv.conf
                    - name: netbird-data
                      mountPath: /var/lib/netbird

              - op: add
                path: /spec/template/spec/containers/-
                value:
                  name: caddy
                  image: caddy:2
                  resources:
                    requests:
                      cpu: 10m
                      memory: 64Mi
                    limits:
                      memory: 128Mi
                  volumeMounts:
                    - name: caddy-config
                      mountPath: /etc/caddy/Caddyfile
                      subPath: Caddyfile
                    - name: caddy-tls
                      mountPath: /certs
                      readOnly: true

              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: resolv-conf
                  emptyDir: {}

              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: netbird-data
                  persistentVolumeClaim:
                    claimName: grafana-netbird

              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: caddy-config
                  configMap:
                    name: grafana-caddy-config

              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: caddy-tls
                  secret:
                    secretName: grafana-tls
  values:
    prometheus:
      prometheusSpec:
        serviceMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        retention: 15d
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            memory: 2Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-rbd-hdd-r2
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 20Gi

    alertmanager:
      alertmanagerSpec:
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-rbd-hdd-r2
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 5Gi

    grafana:
      admin:
        existingSecret: grafana-admin-credentials
        userKey: admin-user
        passwordKey: admin-password

      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1Gi

      readinessProbe:
        initialDelaySeconds: 20
        timeoutSeconds: 5
        periodSeconds: 10
        failureThreshold: 3

      livenessProbe:
        initialDelaySeconds: 60
        timeoutSeconds: 5
        periodSeconds: 10
        failureThreshold: 10

      grafana.ini:
        server:
          domain: ${DNS_NAME_GRAFANA}
          root_url: "https://%(domain)s/"
          enforce_domain: false
        database:
          type: postgres
          host: grafana-postgres-rw.monitoring.svc.cluster.local:5432
          name: grafana
          user: grafana

      envValueFrom:
        GF_DATABASE_PASSWORD:
          secretKeyRef:
            name: grafana-postgres-credentials
            key: password

      persistence:
        enabled: true
        storageClassName: ceph-rbd-hdd-r2
        size: 2Gi

      service:
        enabled: true