apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "69.0.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    createNamespace: true
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    prometheus:
      prometheusSpec:
        serviceMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        retention: 15d
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            memory: 2Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-rbd-hdd-r2
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 20Gi

    alertmanager:
      alertmanagerSpec:
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-rbd-hdd-r2
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 5Gi

    grafana:
      admin:
        existingSecret: grafana-admin-credentials
        userKey: admin-user
        passwordKey: admin-password

      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi

      persistence:
        enabled: true
        storageClassName: ceph-rbd-hdd-r2
        size: 2Gi

      extraInitContainers:
        - name: init-resolv-conf
          image: busybox:1.38
          command:
            - sh
            - -c
            - cp /etc/resolv.conf /resolv-conf/resolv.conf
          volumeMounts:
            - name: resolv-conf
              mountPath: /resolv-conf

      extraContainers: |
        - name: netbird
          image: netbirdio/netbird:0.76.3
          env:
            - name: NB_HOSTNAME
              value: grafana-s1-main01
          envFrom:
            - secretRef:
                name: grafana-netbird-secrets
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            capabilities:
              add:
                - NET_ADMIN
          volumeMounts:
            - name: resolv-conf
              mountPath: /etc/resolv.conf
              subPath: resolv.conf
            - name: netbird-data
              mountPath: /var/lib/netbird
        - name: caddy
          image: caddy:2
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: caddy-config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
            - name: caddy-tls
              mountPath: /certs
              readOnly: true

      extraVolumes:
        - name: resolv-conf
          emptyDir: {}
        - name: netbird-data
          persistentVolumeClaim:
            claimName: grafana-netbird
        - name: caddy-config
          configMap:
            name: grafana-caddy-config
        - name: caddy-tls
          secret:
            secretName: grafana-tls

      service:
        enabled: true