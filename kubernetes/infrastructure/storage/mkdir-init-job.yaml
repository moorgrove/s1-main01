---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: cephfs-root-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: rook-ceph.cephfs.csi.ceph.com
    volumeHandle: cephfs-root-static-pv
    nodeStageSecretRef:
      name: rook-csi-cephfs-node
      namespace: rook-ceph
    volumeAttributes:
      clusterID: rook-ceph
      fsName: hdd-fs-r2
      staticVolume: "true"
      rootPath: /
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cephfs-root-pvc
  namespace: rook-ceph
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  volumeName: cephfs-root-pv
  storageClassName: ""
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cephfs-directory-initializer
  namespace: rook-ceph
  annotations:
    kustomize.toolkit.fluxcd.io/force: "true"
spec:
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: initializer
        image: busybox
        command:
        - sh
        - -c
        - |
          mkdir -p /mnt/cephfs/volumes/svtplay-dl
        volumeMounts:
        - name: cephfs-root
          mountPath: /mnt/cephfs
      volumes:
      - name: cephfs-root
        persistentVolumeClaim:
          claimName: cephfs-root-pvc