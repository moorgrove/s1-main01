apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: external-dns
  labels:
    app: external-dns
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: external-dns
  template:
    metadata:
      labels:
        app: external-dns
    spec:
      serviceAccountName: external-dns
      containers:
        # --- ExternalDNS ---
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.15.0
          env:
            - name: DOMAIN_FILTER
              valueFrom:
                secretKeyRef:
                  name: desec-credentials
                  key: domain-filter
          args:
            - --source=service
            - --domain-filter=$(DOMAIN_FILTER)
            - --provider=webhook
            - --webhook-provider-url=http://localhost:8888
            - --publish-internal-services
            - --txt-owner-id=talos-cluster
            - --policy=sync
            - --registry=txt
            - --interval=5m
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 128Mi

        # --- deSEC Webhook Provider ---
        - name: desec-webhook
          image: ghcr.io/michelangelomo/external-dns-desec-provider:latest
          ports:
            - containerPort: 8888
          env:
            - name: WEBHOOK_APITOKEN
              valueFrom:
                secretKeyRef:
                  name: desec-credentials
                  key: api-token
            - name: WEBHOOK_DOMAINFILTERS
              valueFrom:
                secretKeyRef:
                  name: desec-credentials
                  key: domain-filter
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi